# Hybrid graphics: prefer the stable Intel iGPU (card1) as Hyprland's primary
# render GPU over the NVIDIA dGPU (card2, nouveau driver), which has shown
# GSP-firmware RPC crashes in dmesg right before full system reboots. card2
# stays listed second since the external HDMI port is physically wired
# through it. Set here (not just in Hyprland's env.lua) because this is
# applied by systemd/pam_systemd at login, before any compositor starts -
# guaranteed to exist in Hyprland's environment from the moment it's spawned,
# regardless of Lua config load order.
AQ_DRM_DEVICES=/dev/dri/card1:/dev/dri/card2
